<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROUT TOWN · TURKEY SUB — 10 PAELEO/Oulipo Worksheet Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111;
    --muted: #555555;
    --rule: #222222;
    --hair: #bdbdbd;
    --paper: #ffffff;
    --desk: #f1f0ec;
    --accent: #111111;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ── SCREEN CHROME (HIDDEN IN PRINT) ── */
  .chrome {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #111;
    color: #f5f5f3;
    border-bottom: 2px solid #000;
    padding: 10px 18px;
  }
  .chrome-top {
    max-width: 1260px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    font: 700 12px/1.2 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .brand span { color: #a3a39c; font-weight: 400; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: 600 11px/1 var(--mono);
    padding: 7px 12px;
    border: 1px solid #444;
    background: #1d1d1d;
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { border-color: #fff; }
  .btn.primary { background: #fff; color: #000; border-color: #fff; }

  .tabs {
    max-width: 1260px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .tab {
    font: 600 11px/1.2 var(--mono);
    padding: 6px 10px;
    border: 1px solid #333;
    background: #181818;
    color: #aaa;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: #fff; border-color: #666; }
  .tab.active { background: #f5f5f3; color: #111; border-color: #f5f5f3; }

  /* ── BRIEFING CARD ABOVE SHEET ── */
  .brief {
    max-width: 8.5in;
    margin: 18px auto 0;
    background: #fff;
    border: 1.5px solid #111;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .brief-head {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #ddd;
    padding-bottom: 6px;
  }
  .brief-head h2 { font: 700 14px var(--mono); text-transform: uppercase; }
  .brief-head .lineage { font: 400 11px var(--mono); color: var(--muted); }
  .brief-col b {
    display: block;
    font: 700 10px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  /* ── PRINTABLE 8.5 x 11 SHEET ── */
  .deck { padding: 14px 12px 60px; }
  .version-block { margin-bottom: 36px; }
  .version-block.hidden { display: none; }

  .sheet {
    width: 8.5in;
    height: 11in;
    margin: 14px auto;
    background: var(--paper);
    color: var(--ink);
    padding: 0.48in 0.55in 0.45in;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  /* Sheet Typography & Primitives */
  .s-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 6px;
    font-size: 11px;
  }
  .s-kicker { font: 700 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .s-kicker span { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .s-name { font: 500 11px var(--sans); }
  .s-name .line { display: inline-block; width: 155px; border-bottom: 1px solid var(--ink); }
  .air-pill {
    font: 700 10.5px var(--mono);
    border: 1.5px solid var(--ink);
    padding: 1px 6px;
    margin-left: 6px;
  }

  .s-hero { margin: 8px 0 6px; }
  .s-title {
    font: 400 34px/1.02 var(--serif);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .s-premise {
    font-size: 12.5px;
    color: #222;
    line-height: 1.35;
  }

  .sec-label {
    font: 700 11px var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sec-label span { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: 11px; }

  .choice-strip {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 5px 0 8px;
  }
  .chip {
    border: 1.25px solid var(--ink);
    padding: 4px 10px;
    font: 600 11px var(--mono);
    border-radius: 999px;
  }
  .chip.sq { border-radius: 3px; }

  /* Porthole Open Center */
  .porthole-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 6px 0;
    flex: 1;
    min-height: 2.8in;
  }
  .porthole {
    width: 3.2in;
    height: 3.2in;
    border-radius: 50%;
    border: 3px solid var(--ink);
    outline: 1px solid var(--ink);
    outline-offset: 6px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 34px;
    flex-shrink: 0;
  }
  .porthole-prompt {
    font: italic 11px/1.3 var(--sans);
    color: #777;
    text-align: center;
    max-width: 1.85in;
  }
  .bolt {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1.2px solid var(--ink);
    border-radius: 50%;
    background: #fff;
    font: 700 8px/12px var(--mono);
    text-align: center;
  }
  .b1 { top: 8px; left: 26%; }
  .b2 { top: 46%; left: -12px; }
  .b3 { bottom: 8px; left: 26%; }
  .b4 { top: 8px; right: 26%; }
  .b5 { top: 46%; right: -12px; }
  .b6 { bottom: 8px; right: 26%; }

  /* Split / Fold / Trio Frames */
  .split-frame {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
    margin: 6px 0;
  }
  .trio-frame {
    display: grid;
    grid-template-columns: 1fr 0.9fr 1fr;
    gap: 0;
    flex: 1;
    margin: 6px 0;
    border: 2px solid var(--ink);
  }
  .trio-col {
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .trio-col.fold-mid {
    border-left: 1.5px dashed var(--ink);
    border-right: 1.5px dashed var(--ink);
    background: #fafafa;
  }
  .draw-box {
    border: 2px solid var(--ink);
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 2.3in;
  }
  .draw-box .hint { font-size: 11px; color: #666; font-style: italic; }

  /* Write Lines */
  .field-group { display: flex; flex-direction: column; gap: 9px; margin: 6px 0; }
  .field-row {
    display: grid;
    grid-template-columns: 155px 1fr;
    align-items: baseline;
    gap: 10px;
    font-size: 12px;
  }
  .field-row .lbl { font-weight: 700; font-size: 11.5px; }
  .field-row .lbl small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; }
  .wline {
    border-bottom: 1px solid var(--ink);
    min-height: 22px;
    display: flex;
    align-items: flex-end;
    padding-bottom: 2px;
    font-size: 12px;
    color: #333;
  }
  .slot-box {
    display: inline-block;
    min-width: 120px;
    border-bottom: 1.5px solid var(--ink);
    text-align: center;
    font: 600 10px var(--mono);
    color: #666;
    margin: 0 4px;
  }

  /* Pass Banner */
  .pass-bar {
    border-top: 1.5px solid var(--ink);
    padding-top: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 700 10.5px var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .pass-bar span { font-weight: 400; color: var(--muted); text-transform: none; font-family: var(--sans); font-size: 11px; }

  /* Back 6-Face Crew Grid */
  .crew-panel {
    border: 1.5px solid var(--ink);
    padding: 11px 13px;
    margin-bottom: 8px;
  }
  .crew-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 11.5px;
  }
  .crew-head b { font: 700 10.5px var(--mono); text-transform: uppercase; }
  .crew-head span { white-space: nowrap; }
  .face-row {
    display: grid;
    grid-template-columns: 162px 1fr 82px;
    gap: 10px;
    align-items: end;
    padding: 11px 0 8px;
    border-top: 1px solid #dcdcdc;
    font-size: 11.5px;
  }
  .face-row.no-air { grid-template-columns: 162px 1fr; }
  .face-row.blind { grid-template-columns: 44px 1fr 142px; }
  .die-pip {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--ink);
    font: 700 10.5px/15px var(--mono);
    text-align: center;
    margin-right: 5px;
    vertical-align: middle;
  }
  .face-tag { font: 700 11px var(--mono); }
  .face-tag em { font: 400 10px var(--sans); color: var(--muted); display: block; margin-top: 2px; }
  .air-box {
    font: 600 10px var(--mono);
    border: 1px solid var(--ink);
    padding: 4px 6px;
    text-align: center;
    white-space: nowrap;
  }

  /* Roll, Recovery & Assessment Box */
  .resolve-box {
    border: 2px solid var(--ink);
    padding: 10px 12px;
    background: #fcfcfb;
  }
  .roll-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 7px;
    border-bottom: 1px solid #ccc;
    margin-bottom: 7px;
    font: 700 11.5px var(--mono);
  }
  .die-Blank {
    display: inline-block;
    width: 28px;
    height: 24px;
    border: 1.5px solid var(--ink);
    vertical-align: middle;
    margin: 0 4px;
    background: #fff;
  }
  .audit-bar {
    border-top: 1.5px solid var(--ink);
    padding-top: 7px;
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 11.5px;
  }
  .audit-bar b { font: 700 10.5px var(--mono); text-transform: uppercase; }
  .yn { font: 700 11px var(--mono); border: 1.25px solid var(--ink); padding: 2px 8px; }

  /* 2x2 Matrix for V06 */
  .matrix {
    display: grid;
    grid-template-columns: 110px 1fr 1fr;
    border: 1.5px solid var(--ink);
    margin: 6px 0;
    font-size: 11px;
  }
  .matrix > div { border: 0.75px solid var(--ink); padding: 7px 8px; min-height: 62px; }
  .matrix .m-hdr { background: #f3f3f1; font: 700 10px var(--mono); min-height: auto; text-transform: uppercase; }

  @media print {
    @page { size: letter portrait; margin: 0; }
    body { background: #fff; }
    .chrome, .brief { display: none !important; }
    .deck { padding: 0; }
    .version-block { margin: 0; }
    .version-block.hidden { display: none !important; }
    .sheet {
      margin: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
  }
</style>

<div class="ts-return-bar"><a href="./index.html">← Turkey Sub Hub</a><span class="ts-return-meta">Student Sheets · 10 Oulipo/SCION Classroom Sheets</span></div>

<div class="chrome">
  <div class="chrome-top">
    <div class="brand">PAELEO · TROUT TOWN · TURKEY SUB <span>// 10 Exercise &amp; Printable Worksheet Versions (Front + Back)</span></div>
    <div class="actions">
      <button class="btn" onclick="showAll()">Show All 10</button>

<div class="deck" id="deck"></div>

<script>
const VERSIONS = [
  {
    id: "V01",
    short: "V01 · One-Word Swerve",
    title: "One day of air. One word to change it.",
    lineage: "PAE-00 (The Threshold) + ALAMO Slot Substitution",
    pitch: "Pilot A writes a 2-slot Action ('I use [TOOL] to [VERB]'). Crewmates B & C each write 3 outcomes (○ Probable, △ Plausible, ✡ Preposterous). Pilot rolls once, then rescues the sub in Take 2 by swapping ONLY ONE WORD.",
    assess: "1) Blind sort of B/C rows into ○/△/✡ (0–6 modal score). 2) Partner & SCION film critic check: does swapping that 1 word visibly flip the outcome? [YES/NO]",
    front: `
      <div>
        <div class="sec-label">1 · Circle One Place in Trout Town <span>Where did the sub come to rest?</span></div>
        <div class="choice-strip">
          <span class="chip">Room 4 School</span>
          <span class="chip">PebbleMart</span>
          <span class="chip">Riffle Kitchen</span>
          <span class="chip">Old Bridge</span>
          <span class="chip">Trout Court</span>
        </div>
      </div>
      <div class="porthole-wrap">
        <div class="porthole">
          <span class="bolt b1">1</span><span class="bolt b2">2</span><span class="bolt b3">3</span>
          <span class="bolt b4">4</span><span class="bolt b5">5</span><span class="bolt b6">6</span>
          <div class="porthole-prompt">Draw the trout and what floats outside your porthole</div>
        </div>
      </div>
      <div class="field-group">
        <div class="field-row">
          <div class="lbl">2 · Who stares in?<small>Name the trout &amp; what they hold</small></div>
          <div class="wline"></div>
        </div>
        <div class="field-row">
          <div class="lbl">3 · My Sub Action<small>Fill both slots clearly</small></div>
          <div class="wline" style="border:none;font-size:13px;">
            “I use <span class="slot-box" style="min-width:145px;">(1 TOOL)</span> to <span class="slot-box" style="min-width:175px;">(1 VERB + OBJECT)</span>.”
          </div>
        </div>
        <div class="field-row">
          <div class="lbl">4 · Air Risk<small>What could drain our 24h?</small></div>
          <div class="wline"></div>
        </div>
      </div>
    `,
    passFront: ["→ PASS SHEET LEFT TO CREW B", "Pilot stops here until the roll."],
    back: stdCrewBack({
      take2Label: "TAKE 2 · ONE-WORD RECOVERY — Copy your Action, cross out ONE word, write a replacement:",
      take2Line: "“I use _______________________ to ___________________________.”  →  New result: ___________________________",
      auditQ: "PARTNER CHECK: Did Pilot change ONLY one word, and can you see why the ending flipped?"
    })
  },

  {
    id: "V02",
    short: "V02 · Blind Judge",
    title: "Six secret futures. Can you tell how wild?",
    lineage: "Calvino (Cybernetics & Ghosts) — Post-hoc Modal Filtering",
    pitch: "Crew B and Crew C each write 3 outcomes (one Probable, one Plausible, one Preposterous) IN SECRET SCRAMBLED ORDER without labeling them. Pilot A must judge and label all 6 before rolling.",
    assess: "Exact calibration score (0–6): How many of Pilot A's ○/△/✡ guesses match Crew B & C's folded secret key? Measures shared intuition of probability vs. imagination.",
    front: `
      <div>
        <div class="sec-label">1 · Where the Turkey Sub Landed <span>Circle one</span></div>
        <div class="choice-strip">
          <span class="chip">Birthday Dock</span>
          <span class="chip">PebbleMart Aisle</span>
          <span class="chip">School Chalkboard</span>
          <span class="chip">Diner Stove</span>
          <span class="chip">Bridge Arch</span>
        </div>
      </div>
      <div class="porthole-wrap">
        <div class="porthole">
          <span class="bolt b1">1</span><span class="bolt b2">2</span><span class="bolt b3">3</span>
          <span class="bolt b4">4</span><span class="bolt b5">5</span><span class="bolt b6">6</span>
          <div class="porthole-prompt">Draw the moment right before you press the button</div>
        </div>
      </div>
      <div class="field-group">
        <div class="field-row"><div class="lbl">2 · Goal on Surface<small>Why must the turkey get up?</small></div><div class="wline"></div></div>
        <div class="field-row"><div class="lbl">3 · What I Try<small>One clear move from the sub</small></div><div class="wline"></div></div>
      </div>
    `,
    passFront: ["→ PASS SHEET LEFT TO CREW B", "Crew B & C will scramble ○ Probable, △ Plausible, ✡ Preposterous!"],
    back: `
      <div class="crew-panel">
        <div class="crew-head"><b>CREW B (4 MIN) — Write one ○ Probable, one △ Plausible, one ✡ Preposterous IN MIXED ORDER!</b> <span>Name: ___________</span></div>
        <div class="face-row blind"><span class="face-tag"><span class="die-pip">1</span></span><div class="wline"></div><div class="air-box">Guess: ○  △  ✡</div></div>
        <div class="face-row blind"><span class="face-tag"><span class="die-pip">2</span></span><div class="wline"></div><div class="air-box">Guess: ○  △  ✡</div></div>
        <div class="face-row blind"><span class="face-tag"><span class="die-pip">3</span></span><div class="wline"></div><div class="air-box">Guess: ○  △  ✡</div></div>
        <div style="font:600 9.5px var(--mono);color:#555;margin-top:6px;text-align:right;">Crew B tiny key (cover with thumb until judged): 1=___  2=___  3=___   [ → PASS TO CREW C ]</div>
      </div>
      <div class="crew-panel">
        <div class="crew-head"><b>CREW C (4 MIN) — Write one ○ Probable, one △ Plausible, one ✡ Preposterous IN MIXED ORDER!</b> <span>Name: ___________</span></div>
        <div class="face-row blind"><span class="face-tag"><span class="die-pip">4</span></span><div class="wline"></div><div class="air-box">Guess: ○  △  ✡</div></div>
        <div class="face-row blind"><span class="face-tag"><span class="die-pip">5</span></span><div class="wline"></div><div class="air-box">Guess: ○  △  ✡</div></div>
        <div class="face-row blind"><span class="face-tag"><span class="die-pip">6</span></span><div class="wline"></div><div class="air-box">Guess: ○  △  ✡</div></div>
        <div style="font:600 9.5px var(--mono);color:#555;margin-top:4px;text-align:right;">Crew C tiny key (cover with thumb until judged): 4=___  5=___  6=___   [ → RETURN TO PILOT ]</div>
      </div>
      <div class="resolve-box">
        <div class="roll-strip">
          <span>1. JUDGE ALL 6 ABOVE FIRST!   Matches: <span class="die-Blank"></span> / 6</span>
          <span>2. ROLL DIE: <span class="die-Blank"></span></span>
        </div>
        <div class="field-group">
          <div class="field-row"><div class="lbl">Take 2 · Swerve<small>Change 1 thing at the roll</small></div><div class="wline"></div></div>
        </div>
        <div class="audit-bar"><b>CALIBRATION CHECK:</b> <span>Which pair of faces caused an argument between ○, △, and ✡? Circle numbers: 1 2 3 4 5 6</span></div>
      </div>
    `
  },

  {
    id: "V03",
    short: "V03 · Two Eyes, One Clue",
    title: "The fish think our sub is a UFO.",

function stdCrewBack(opts = {}) {
  const bP = opts.bPrompt || "CREW B (3 MIN) — How does Trout Town react to Pilot’s move?";
  const cP = opts.cPrompt || "CREW C (3 MIN) — Three different ways the river answers back:";
  return `
    <div class="crew-panel">
      <div class="crew-head"><b>${bP}</b> <span>Crew B: ______________</span></div>
      <div class="face-row"><span class="face-tag"><span class="die-pip">1</span>○ PROBABLE<em>Expected / everyday</em></span><div class="wline"></div><div class="air-box">Air +/- ___h</div></div>
      <div class="face-row"><span class="face-tag"><span class="die-pip">2</span>△ PLAUSIBLE<em>Fits Trout Town rules</em></span><div class="wline"></div><div class="air-box">Air +/- ___h</div></div>
      <div class="face-row"><span class="face-tag"><span class="die-pip">3</span>✡ PREPOSTEROUS<em>Wild swerve!</em></span><div class="wline"></div><div class="air-box">Air +/- ___h</div></div>
      <div style="font:700 9.5px var(--mono);text-align:right;margin-top:6px;">[ → PASS SHEET LEFT TO CREW C ]</div>
    </div>

    <div class="crew-panel">
      <div class="crew-head"><b>${cP}</b> <span>Crew C: ______________</span></div>
      <div class="face-row"><span class="face-tag"><span class="die-pip">4</span>○ PROBABLE<em>Expected / everyday</em></span><div class="wline"></div><div class="air-box">Air +/- ___h</div></div>
      <div class="face-row"><span class="face-tag"><span class="die-pip">5</span>△ PLAUSIBLE<em>Fits Trout Town rules</em></span><div class="wline"></div><div class="air-box">Air +/- ___h</div></div>
      <div class="face-row"><span class="face-tag"><span class="die-pip">6</span>✡ PREPOSTEROUS<em>Wild swerve!</em></span><div class="wline"></div><div class="air-box">Air +/- ___h</div></div>
      <div style="font:700 9.5px var(--mono);text-align:right;margin-top:4px;">[ → RETURN TO ORIGINAL PILOT ]</div>
    </div>

    <div class="resolve-box">
      <div class="roll-strip">
        <span>TAKE 1 · ROLL ONE DIE:  I rolled <span class="die-Blank"></span></span>
        <span>Air Remaining: <span class="die-Blank" style="width:42px;"></span> h</span>

      <div style="font:700 10.5px var(--mono);margin-bottom:5px;">${opts.take2Label}</div>
      <div style="font-size:12px;line-height:1.8;">${opts.take2Line}</div>

        <span class="yn">PASS  /  RETRY</span>
      </div>
    </div>
  `;
}

        <div class="s-hero">
          <h1 class="s-title">${v.title}</h1>
          <p class="s-premise">A turkey in a homemade sub wakes underwater in Trout Town with 24 hours of air and no memory of why it came.</p>
        </div>
      </div>
      ${v.front}
      <div class="pass-bar">
        <b>${v.passFront[0]}</b>
        <span>${v.passFront[1]}</span>
      </div>
    </section>

    <!-- PAGE 2: BACK -->
    <section class="sheet">
      <div class="s-top">
        <div class="s-kicker">TROUT TOWN · TURKEY SUB <span>${v.id} · BACK (6 BOLTS &amp; ROLL)</span></div>
        <div class="s-name">Pilot’s Sub <span class="air-pill">1 DIE · 6 CHANCES</span></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-top:8px;">
        ${v.back}
      </div>
      <div class="pass-bar">
        <b>COMPLETE · HAND IN</b>
        <span>PAELEO Screening Room compiles Drawing + Roll + Take 2 into your Porthole Film.</span>
      </div>
    </section>
  `;
  deckEl.appendChild(block);
});

function selectVersion(idx) {
  document.querySelectorAll(".tab").forEach((el, i) => el.classList.toggle("active", i === idx));
  document.querySelectorAll(".version-block").forEach((el, i) => el.classList.toggle("hidden", i !== idx));
  window.scrollTo({ top: 0, behavior: "instant" });
}

function showAll() {
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".version-block").forEach(el => el.classList.remove("hidden"));
}
if (location.search.includes("all=1")) showAll();
</script>
</body>
</html>
