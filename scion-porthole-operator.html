<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SCION / 55 Porthole Animation Swarms · Multi-SCION Operator Desk · Turkey Sub</title>
  <meta name="description" content="BOLAS / PAELEO 55-Porthole Multi-SCION Workshop & Animation Operator Desk: 4 coordinated SCION swarms, foraged plate provenance, V2 vs. V1 side-by-side screening, 60fps playable rig, and copyable .md / .poml instructions.">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <style>
    :root {
      --paper: #fbfaf7;
      --paper-2: #f3efe6;
      --panel: #eef0f3;
      --label: #fffdf8;
      --ink: #14110d;
      --ink-2: #5b5348;
      --mute: #766e62;
      --rule: #d6d3cc;
      --rule-dark: #14110d;
      --dusk: #2a3a63;
      --dusk-2: #3c4f7c;
      --lamp: #f2b85a;
      --lamp-2: #9a6514;
      --stamp: #d42a1e;
      --teal: #0f8f80;
      --kraft: #b98a52;

      /* Canonical 4-Variation Rubric */
      --beat-a: #14110d;   /* I · Real Creek */
      --beat-b: #1d596e;   /* II · Probable · Turkey */
      --beat-c: #0f8f80;   /* III · Plausible · Trout */
      --beat-d: #d42a1e;   /* IV · Preposterous · Alien */

      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --body: "Literata", Georgia, "Iowan Old Style", serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --masthead-h: 58px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--masthead-h, 58px) + 14px);
      -webkit-text-size-adjust: 100%;
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 16px/1.55 var(--body);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration-color: var(--stamp);
      text-underline-offset: 3px;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
    img, video, canvas { max-width: 100%; display: block; }
    code {
      font-family: var(--mono);
      font-size: 0.84em;
      background: var(--panel);
      padding: 1px 5px;
      border-radius: 2px;
    }

    .skip {
      position: absolute;
      left: 12px;
      top: -60px;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 12px;
      z-index: 200;
      text-decoration: none;
    }
    .skip:focus { top: 10px; }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── TOP BOLAS MASTHEAD ── */
    .masthead {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(251, 250, 247, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--ink);
      padding: 10px clamp(14px, 2.6vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px 18px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 12px;
    }
    .masthead-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .back-link {
      text-decoration: none;
      color: var(--ink-2);
      padding: 3px 8px;
      border: 1px solid var(--rule);
      background: var(--label);
    }
    .back-link:hover {
      border-color: var(--ink);
      color: var(--ink);
    }
    .brand {
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(20px, 2.3vw, 26px);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-decoration: none;
      line-height: 1;
      color: var(--ink);
    }
    .brand span { color: var(--stamp); padding: 0 3px; }
    .masthead-links {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .masthead-links a {
      text-decoration: none;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .masthead-links a:hover {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--stamp);
    }

    /* ── TWO-COLUMN MONSIEUR RIPOIS OPERATOR DESK ── */
    .desk {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(290px, 356px) minmax(0, 1fr);
      align-items: start;
      min-height: calc(100dvh - var(--masthead-h, 58px));
    }

    /* ── LEFT CATALOGUE SIDEBAR (#01–#55) ── */
    .catalogue {
      position: sticky;
      top: var(--masthead-h, 58px);
      height: calc(100dvh - var(--masthead-h, 58px));
      scroll-margin-top: var(--masthead-h, 58px);
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--ink);
      background: var(--paper-2);
      min-width: 0;
    }
    .catalogue-head {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .catalogue-head h1 {
      font-family: var(--display);
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }
    .catalogue-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-2);
    }
    .browse-toggle {
      display: none;
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 4px 9px;
      border: 1.5px solid var(--ink);
      background: var(--label);
    }
    .catalogue-controls {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    .search-box {
      padding: 10px 14px 8px;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid var(--ink);
      background: var(--label);
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--ink);
      border-radius: 2px;
    }
    .search-input::placeholder { color: var(--mute); }

    .filter-pills {
      padding: 0 14px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      border-bottom: 1px solid var(--rule);
    }
    .f-pill {
      font-family: var(--mono);
      font-size: 10.8px;
      letter-spacing: 0.02em;
      padding: 3px 7px;
      border: 1px solid var(--ink-2);
      background: var(--label);
      color: var(--ink-2);
      border-radius: 2px;
    }
    .f-pill:hover {
      border-color: var(--ink);
      color: var(--ink);
    }
    .f-pill[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
      font-weight: 600;
    }

    .catalogue-count {
      padding: 6px 14px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-2);
      border-bottom: 1px solid var(--rule);
      background: rgba(255, 253, 248, 0.55);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .station-list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 6px 8px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .st-item {
      display: grid;
      gap: 3px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-left: 3px solid transparent;
      background: transparent;
      border-radius: 2px;
      transition: background-color 0.1s ease;
    }
    .st-item:hover {
      background: var(--label);
      border-color: var(--rule);
      border-left-color: var(--ink-2);
    }
    .st-item[aria-current="true"] {
      background: var(--label);
      border-color: var(--ink);
      border-left: 4px solid var(--stamp);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .st-row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }
    .st-code {
      font-family: var(--display);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--ink);
    }
    .st-pass {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--teal);
      font-weight: 600;
    }
    .st-clue {
      font-size: 13px;
      line-height: 1.3;
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .st-badge {
      font-family: var(--mono);
      font-size: 10.3px;
      color: var(--dusk);
      background: var(--panel);
      padding: 1px 6px;
      border-radius: 2px;
      justify-self: start;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── RIGHT OPERATOR DESK FOR SELECTED PORTHOLE #NN ── */
    .selection {
      padding: clamp(18px, 3vw, 32px) clamp(16px, 3.2vw, 40px) 80px;
      scroll-margin-top: calc(var(--masthead-h, 58px) + 14px);
      min-width: 0;
      display: grid;
      gap: 24px;
    }

    /* 1. Header & Copy Actions */
    .work-heading {
      border: 2px solid var(--ink);
      background: var(--label);
      padding: 18px 22px;
      display: grid;
      gap: 10px;
    }
    .work-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .meta-pills {
      display: flex;
      align-items: center;
      gap: 8px 10px;
      flex-wrap: wrap;
    }
    .st-pill {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border: 1.5px solid var(--teal);
      color: var(--teal);
      font-weight: 600;
      border-radius: 2px;
    }
    .style-pill {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      background: var(--panel);
      border: 1px solid var(--rule);
      color: var(--dusk);
    }
    .byline {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .step-btns {
      display: flex;
      gap: 6px;
      align-items: center;
      font-family: var(--mono);
      font-size: 12px;
    }
    .step-btn {
      padding: 4px 9px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
    }
    .step-btn:hover:not(:disabled) {
      background: var(--ink);
      color: var(--paper);
    }
    .step-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .work-title {
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(32px, 4.5vw, 54px);
      line-height: 0.94;
      text-transform: uppercase;
      margin: 2px 0 0;
      letter-spacing: 0.005em;
    }
    .work-title .station-prefix { color: var(--stamp); }
    .work-thesis {
      margin: 0;
      font-size: 17px;
      line-height: 1.48;
      color: var(--ink-2);
      max-width: 74ch;
    }
    .work-thesis strong { color: var(--ink); }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding-top: 4px;
    }
    .btn {
      border: 1.5px solid var(--ink);
      background: var(--paper);
      padding: 6px 12px;
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--ink);
      color: var(--paper);
    }
    .btn.primary {
      background: var(--ink);
      color: var(--paper);
    }
    .btn.primary:hover {
      background: var(--stamp);
      border-color: var(--stamp);
      color: #fff;
    }
    .btn.accent-teal {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--label);
    }
    .btn.accent-teal:hover {
      background: var(--teal);
      color: #fff;
    }
    .copy-status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--teal);
      font-weight: 600;
    }

    /* 2. Interactive Remake vs. V1 Stage */
    .stage-shell {
      border: 2px solid var(--ink);
      background: var(--label);
    }
    .stage-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border-bottom: 2px solid var(--ink);
      background: var(--paper-2);
    }
    .stage-tab {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 14px;
      border-right: 1px solid var(--rule);
      color: var(--ink-2);
      background: transparent;
      position: relative;
    }
    .stage-tab:hover {
      color: var(--ink);
      background: rgba(255, 253, 248, 0.7);
    }
    .stage-tab[aria-selected="true"] {
      background: var(--label);
      color: var(--ink);
      box-shadow: inset 0 -3px 0 var(--stamp);
    }

    .stage-body {
      padding: 16px 18px 18px;
      display: grid;
      gap: 12px;
    }
    .screen-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #121519;
      border: 1.5px solid var(--ink);
      overflow: hidden;
    }
    .screen-frame video,
    .screen-frame canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .screen-frame canvas {
      cursor: pointer;
      touch-action: manipulation;
    }

    .film-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .beat-jumps {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .beat-chip {
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 9px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      border-radius: 2px;
    }
    .beat-chip:hover {
      background: var(--ink);
      color: var(--paper);
    }
    .beat-chip.b-a { border-left: 4px solid var(--beat-a); }
    .beat-chip.b-b { border-left: 4px solid var(--beat-b); }
    .beat-chip.b-c { border-left: 4px solid var(--beat-c); }
    .beat-chip.b-d { border-left: 4px solid var(--beat-d); }

    /* Compare V2 vs V1 Side-by-Side */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .compare-col {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .compare-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 11.5px;
      border: 1.5px solid var(--ink);
      background: var(--paper-2);
    }
    .compare-head.v2 {
      border-left: 5px solid var(--stamp);
      background: #fff9f5;
    }
    .compare-head.v1 {
      border-left: 5px solid var(--ink-2);
    }
    .compare-note {
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--ink-2);
      padding: 8px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
    }

    /* Live 60fps Rig Controls */
    .snail-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      background: var(--paper);
      border: 1.5px solid var(--ink);
      font-family: var(--mono);
      font-size: 11.5px;
    }
    .snail-stamp {
      width: 11px;
      height: 11px;
      background: var(--stamp);
      border: 1px solid var(--ink);
      display: inline-block;
      flex: 0 0 11px;
    }
    .snail-input {
      flex: 1 1 240px;
      min-width: 160px;
      border: 0;
      border-bottom: 1.5px solid var(--ink);
      background: transparent;
      padding: 3px 4px;
      font-family: var(--body);
      font-size: 14.5px;
    }
    .snail-input:focus { outline: none; border-bottom-color: var(--stamp); }

    .rig-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      background: var(--paper-2);
      border: 1.5px solid var(--ink);
      font-family: var(--mono);
      font-size: 11.5px;
    }
    .rig-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .r-btn {
      border: 1.5px solid var(--ink);
      background: var(--label);
      padding: 4px 8px;
      font-family: var(--mono);
      font-size: 11.2px;
      font-weight: 600;
    }
    .r-btn.on { background: var(--ink); color: var(--paper); }
    .r-btn.ed-v2 { border-color: var(--stamp); color: var(--stamp); }
    .r-btn.ed-v2.on { background: var(--stamp); color: #fff; }
    .r-btn.v-turkey { background: var(--beat-b); border-color: var(--beat-b); color: #fff; }
    .r-btn.v-trout { background: var(--beat-c); border-color: var(--beat-c); color: #fff; }
    .r-btn.v-alien { background: var(--beat-d); border-color: var(--beat-d); color: #fff; }

    /* Reference Plates Tab */
    .plates-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 16px;
      align-items: start;
    }
    .plate-card {
      border: 1.5px solid var(--ink);
      background: var(--paper);
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .plate-card img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #14181c;
      border: 1px solid var(--rule);
    }
    .plate-card.seed-plate img {
      background: var(--label);
      mix-blend-mode: multiply;
    }
    .plate-kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--stamp);
      font-weight: 600;
    }

    /* Blind Critic Strip Tab */
    .critic-card {
      border: 1.5px solid var(--ink);
      background: var(--paper);
      display: grid;
      gap: 0;
    }
    .critic-head {
      padding: 8px 12px;
      background: var(--paper-2);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11.5px;
    }
    .critic-strip-img {
      width: 100%;
      height: auto;
      background: #121519;
      border-bottom: 1px solid var(--rule);
    }
    .critic-notes {
      padding: 12px 14px;
      display: grid;
      gap: 8px;
      font-size: 14.5px;
      line-height: 1.5;
    }
    .critic-notes p { margin: 0; max-width: none; }

    /* Provenance <details> matching BOLAS Screening Room */
    .provenance-drawer {
      border: 1.5px solid var(--ink);
      background: var(--label);
      padding: 10px 16px;
    }
    .provenance-drawer summary {
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--ink);
      padding: 3px 0;
    }
    .provenance-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
      display: grid;
      gap: 12px;
      font-size: 15px;
    }
    .provenance-body p { margin: 0; max-width: 82ch; }
    .sources-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .sources-list li {
      padding: 6px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--dusk);
      font-size: 13.5px;

  <script>
    (function () {
      "use strict";

      var STACKS = window.PORTHOLE_SCION_STACKS || {};
      var VERDICTS = window.PORTAL_VERDICTS || {};
      var STUDENT = window.STUDENT_OPTIONS || {};
      var SNAIL_STORE_KEY = "turkey_sub_snail_mail_v1";

      var selectedId = 1;
      var activeFilter = "all";
      var searchQuery = "";
      var activeStageTab = "remake"; // "remake" | "compare" | "rig" | "plates" | "critic"
      var activePromptFmt = "md";    // "md" | "poml"
      var remakeWatchFullSound = false;
      var compareAudioSource = "v2"; // "v2" | "v1" | "mute"
      var stripEdition = "v2";       // "v2" | "v1"
      var filteredIds = [];

      // Self-contained + window.__game compatible 60fps Live Rig state
      var rigRaf = 0;
      var rigLastMs = 0;
      var loadedRemakeBatches = {};
      var rig = {
        edition: "v2", // "v2" | "v1"
        t: 0.4,
        view: "auto",  // "auto" | "real" | "turkey" | "trout" | "alien"
        lamp: true,
        ballast: false,
        roll: 0,
        showCaptions: true,
        muted: false,
        snailActive: false,
        snailT: 0,
        snailDelivered: false,
        snailNote: ""
      };

      var qInput = document.getElementById("queryInput");
      var stationListEl = document.getElementById("stationList");
      var countEl = document.getElementById("catalogueCount");
      var selectionEl = document.getElementById("selection");
      var browseBtn = document.getElementById("browseToggle");
      var controlsWrap = document.getElementById("catalogueControls");

      function pad2(n) { return n < 10 ? "0" + n : String(n); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function parseHashId() {
        var h = (location.hash || "").replace(/^#/, "").trim();
        var m = /^(?:p|play-|scion-|portal-)?(\d{1,2})$/i.exec(h);
        if (!m) return null;
        var num = parseInt(m[1], 10);
        return (num >= 1 && num <= 55) ? num : null;
      }

      function getSnailNote(id) {
        try {
          if (window.__game && typeof window.__game.getSnailNote === "function") {
            return window.__game.getSnailNote(id);
          }
          var raw = localStorage.getItem(SNAIL_STORE_KEY);
          if (!raw) return "";
          var map = JSON.parse(raw);
          return (map && typeof map[String(id)] === "string") ? map[String(id)] : "";
        } catch (e) {
          return "";
        }
      }

      function saveSnailNote(id, txt) {
        try {
          if (window.__game && typeof window.__game.setSnailNote === "function") {
            return window.__game.setSnailNote(txt, id);
          }
          var raw = localStorage.getItem(SNAIL_STORE_KEY);
          var map = raw ? (JSON.parse(raw) || {}) : {};
          var clean = String(txt || "").trim().slice(0, 180);
          if (clean) map[String(id)] = clean;
          else delete map[String(id)];
          localStorage.setItem(SNAIL_STORE_KEY, JSON.stringify(map));
          return clean;
        } catch (e) {
          return "";
        }
      }

      function ensureRemakeBatchLoaded(id, cb) {
        var batchNum = Math.ceil(id / 5);
        var bPad = pad2(batchNum);
        if (window.PORTAL_REMAKE_SCENES && window.PORTAL_REMAKE_SCENES[id]) {
          if (cb) cb(true);
          return;
        }
        if (loadedRemakeBatches[bPad] === "loading") {
          setTimeout(function () { if (cb) cb(!!(window.PORTAL_REMAKE_SCENES && window.PORTAL_REMAKE_SCENES[id])); }, 180);
          return;
        }
        if (loadedRemakeBatches[bPad] === "done") {
          if (cb) cb(!!(window.PORTAL_REMAKE_SCENES && window.PORTAL_REMAKE_SCENES[id]));
          return;
        }
        loadedRemakeBatches[bPad] = "loading";
        var s = document.createElement("script");
        s.src = "./portals/remake-" + bPad + ".js";
        s.onload = function () {
          loadedRemakeBatches[bPad] = "done";
          if (cb) cb(!!(window.PORTAL_REMAKE_SCENES && window.PORTAL_REMAKE_SCENES[id]));
        };
        s.onerror = function () {
          loadedRemakeBatches[bPad] = "missing";
          if (cb) cb(false);
        };
        document.head.appendChild(s);
      }

      function stopLiveRig() {
        if (rigRaf) {
          cancelAnimationFrame(rigRaf);
          rigRaf = 0;
        }
        if (window.__game && window.__game.active) {
          window.__game.unmount();
        }
      }

      function cleanupMedia() {
        stopLiveRig();
        selectionEl.querySelectorAll("video").forEach(function (v) {
          try {
            v.pause();
            v.removeAttribute("src");
            v.load();
          } catch (e) {}
        });
      }

      function downloadFile(filename, content, mime) {
        var blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 250);
      }

      function flashStatus(msg) {
        var el = document.getElementById("copyStatus");
        if (!el) return;
        el.textContent = msg;
        clearTimeout(flashStatus._t);
        flashStatus._t = setTimeout(function () {
          if (el) el.textContent = "";
        }, 2000);
      }

      function matchesStation(st) {
        if (!st) return false;
        if (activeFilter !== "all" && st.filterGroup !== activeFilter) return false;
        if (searchQuery) {
          var sOpt = STUDENT[st.id] || {};
          var hay = [
            st.code, st.station, st.clue, st.reference, st.recipeBadge,
            st.bolasStyle, st.bolasStyleMeta && st.bolasStyleMeta.label,
            st.workshopScion && st.workshopScion.work,
            st.workshopScion && st.workshopScion.title,
            st.directorSwarm && st.directorSwarm.title,
            st.directorSwarm && st.directorSwarm.code,
            st.atlasScion && st.atlasScion.title,
            sOpt.a, sOpt.b, sOpt.c, sOpt.d
          ].join(" ").toLowerCase();
          if (hay.indexOf(searchQuery) === -1) return false;
        }
        return true;
      }

      function renderCatalogue() {
        filteredIds = [];
        var html = "";
        for (var i = 1; i <= 55; i++) {
          var st = STACKS[i];
          if (!matchesStation(st)) continue;
          filteredIds.push(i);
          var isCur = (i === selectedId);
          var verd = VERDICTS[String(i)];
          var shortBadge = (st.workshopScion ? st.workshopScion.work : "") + " · " +
            (st.directorSwarm ? st.directorSwarm.code + " " + st.directorSwarm.shortName : "");
          html += (
            '<button type="button" class="st-item" data-pick="' + i + '" aria-current="' + (isCur ? "true" : "false") + '">' +
              '<div class="st-row1">' +
                '<span class="st-code">' + esc(st.station) + '</span>' +
                '<span class="st-pass">' + (verd && verd.status === "passed" ? "✓ Passed" : esc(st.bolasStyle)) + '</span>' +
              '</div>' +
              '<div class="st-clue">' + esc(st.clue) + '</div>' +
              '<span class="st-badge">' + esc(shortBadge) + '</span>' +
            '</button>'
          );
        }

        countEl.innerHTML = '<span>Showing <strong>' + filteredIds.length + '</strong> of 55 portholes</span><span>#p01–#p55</span>';
        stationListEl.innerHTML = html || '<p style="padding:14px 8px;font-size:13.5px;color:var(--ink-2)">No stations match that filter.</p>';

        stationListEl.querySelectorAll("[data-pick]").forEach(function (btn) {
          btn.onclick = function () {
            var nextId = parseInt(btn.getAttribute("data-pick"), 10);
            selectPorthole(nextId, true);
            if (window.innerWidth <= 980) {
              controlsWrap.setAttribute("data-collapsed", "true");
              browseBtn.setAttribute("aria-expanded", "false");
            }
          };
        });
      }

      function buildStageContentHtml(st, verdict) {
        var id = st.id;
        var pad = st.pad || pad2(id);
        var v2Film = "./films/portholes/p" + pad + ".mp4";
        var v1Film = "./films/portholes-v1/p" + pad + ".mp4";
        var v2Poster = "./thumbs/p" + pad + "-remake.jpg";
        var seedImg = st.portholePlate || ("./portholes/p" + pad + ".jpg");
        var atlasImg = st.atlasPlate || "./assets/atlas-stills/atlas-01.webp";
        var atlasMeta = st.atlasPlateMeta || {};
        var bMeta = st.bolasStyleMeta || {};

        if (activeStageTab === "remake") {
          return (
            '<div class="screen-frame">' +
              (remakeWatchFullSound
                ? '<video id="v2MainVideo" controls autoplay playsinline src="' + v2Film + '" poster="' + v2Poster + '"></video>'
                : '<video id="v2ExcerptVideo" muted loop playsinline autoplay src="' + v2Film + '" poster="' + v2Poster + '" data-seg="1.2,16.5"></video>') +
            '</div>' +
            '<div class="film-bar">' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
                (remakeWatchFullSound

            navigator.clipboard.writeText(st.compiledPromptMd).then(function () {
              flashStatus("✓ Copied Multi-SCION .md");
            });
          }
        };
        document.getElementById("btnSavePoml").onclick = function () {
          downloadFile("scion-porthole-p" + pad + ".poml", st.compiledPromptPoml, "application/xml;charset=utf-8");
          flashStatus("✓ Saved scion-porthole-p" + pad + ".poml");
        };
        document.getElementById("btnSaveMd").onclick = function () {
          downloadFile("scion-porthole-p" + pad + ".md", st.compiledPromptMd, "text/markdown;charset=utf-8");
          flashStatus("✓ Saved scion-porthole-p" + pad + ".md");
        };
        document.getElementById("btnCopyDeepLink").onclick = function () {
          var url = location.origin + location.pathname + "#p" + pad;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(function () {
              flashStatus("✓ Copied #p" + pad + " link");
            });
          }
        };

        // Stage tabs
        selectionEl.querySelectorAll("[data-stab]").forEach(function (tabBtn) {
          tabBtn.onclick = function () {
            activeStageTab = tabBtn.getAttribute("data-stab");
            if (activeStageTab !== "remake") remakeWatchFullSound = false;
            renderSelection();
          };
        });

        // Prompt format sub-tabs
        selectionEl.querySelectorAll("[data-pfmt]").forEach(function (b) {
          b.onclick = function () {
            activePromptFmt = b.getAttribute("data-pfmt");
            renderSelection();
          };
        });
        document.getElementById("btnCopyPromptBox").onclick = function () {
          var txt = activePromptFmt === "poml" ? st.compiledPromptPoml : st.compiledPromptMd;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(txt).then(function () {
              flashStatus("✓ Copied " + (activePromptFmt === "poml" ? ".poml" : ".md"));
            });
          }
        };
        document.getElementById("btnDownloadPromptBox").onclick = function () {
          if (activePromptFmt === "poml") {
            downloadFile("scion-porthole-p" + pad + ".poml", st.compiledPromptPoml, "application/xml;charset=utf-8");
          } else {
            downloadFile("scion-porthole-p" + pad + ".md", st.compiledPromptMd, "text/markdown;charset=utf-8");
          }
        };

        // 4-Beat ledger jump buttons
        selectionEl.querySelectorAll("[data-jump-beat]").forEach(function (b) {
          b.onclick = function () {
            var which = b.getAttribute("data-jump-beat");
            var mapSec = { a: 0.2, b: 4.5, c: 9.9, d: 14.7 };
            var mapView = { a: "real", b: "turkey", c: "trout", d: "alien" };
            if (activeStageTab === "rig") {
              if (window.__game && window.__game.active && typeof window.__game.setView === "function") {
                window.__game.setView(mapView[which] || "auto");
              }
            } else {
              activeStageTab = "remake";
              remakeWatchFullSound = true;
              renderSelection();
              var v = document.getElementById("v2MainVideo");
              if (v) {
                var seekTo = mapSec[which] || 0;
                var doSeek = function () {
                  try { v.currentTime = seekTo; v.play().catch(function () {}); } catch (e) {}
                };
                if (v.readyState >= 1) doSeek();
                else v.addEventListener("loadedmetadata", doSeek, { once: true });
              }
            }
            selectionEl.querySelector(".stage-shell").scrollIntoView({ behavior: "smooth", block: "nearest" });
          };
        });

        // Tab-specific wiring
        if (activeStageTab === "remake") {
          var exVid = document.getElementById("v2ExcerptVideo");
          if (exVid) {
            var seg = (exVid.getAttribute("data-seg") || "1.2,16.5").split(",");
            var sA = parseFloat(seg[0]) || 1.2;
            var sB = parseFloat(seg[1]) || 16.5;
            exVid.addEventListener("loadedmetadata", function () {
              if (exVid.duration > sA + 0.5) {
                try { exVid.currentTime = sA; } catch (e) {}
              }
            });
            exVid.addEventListener("timeupdate", function () {
              var capB = Math.min(sB, (exVid.duration || 18) - 0.25);
              if (exVid.currentTime > capB || exVid.currentTime < sA - 0.35) {
                try { exVid.currentTime = sA; } catch (e) {}
              }
            });
          }
          var wBtn = document.getElementById("btnWatchSound");
          if (wBtn) {
            wBtn.onclick = function () {
              remakeWatchFullSound = true;
              renderSelection();
            };
          }
          var bEx = document.getElementById("btnBackExcerpt");
          if (bEx) {
            bEx.onclick = function () {
              remakeWatchFullSound = false;
              renderSelection();
            };
          }
          var swCmp = document.getElementById("btnSwitchCompare");
          if (swCmp) {
            swCmp.onclick = function () {
              activeStageTab = "compare";
              renderSelection();
            };
          }
          var swRig = document.getElementById("btnSwitchLiveRig");
          if (swRig) {
            swRig.onclick = function () {
              activeStageTab = "rig";
              renderSelection();
            };
          }
          selectionEl.querySelectorAll("[data-seek]").forEach(function (sb) {
            sb.onclick = function () {
              var sec = parseFloat(sb.getAttribute("data-seek")) || 0;
              if (!remakeWatchFullSound) {
                remakeWatchFullSound = true;
                renderSelection();
              }
              var mv = document.getElementById("v2MainVideo");
              if (mv) {
                var apply = function () {
                  try { mv.currentTime = Math.min(sec, (mv.duration || 18) - 0.3); mv.play().catch(function () {}); } catch (e) {}
                };
                if (mv.readyState >= 1) apply();
                else mv.addEventListener("loadedmetadata", apply, { once: true });
              }
            };
          });
        } else if (activeStageTab === "compare") {
          var v2 = document.getElementById("cmpV2Video");
          var v1 = document.getElementById("cmpV1Video");
          var applyCmpMute = function () {
            if (!v2 || !v1) return;
            v2.muted = (compareAudioSource !== "v2");
            v1.muted = (compareAudioSource !== "v1");
          };
          applyCmpMute();

          document.getElementById("btnSyncBoth").onclick = function () {
            [v2, v1].forEach(function (v) {
              if (!v) return;
              try { v.currentTime = 0; v.play().catch(function () {}); } catch (e) {}
            });
          };
          document.getElementById("btnPlayPauseBoth").onclick = function () {
            var shouldPlay = v2 && v2.paused;
            [v2, v1].forEach(function (v) {
              if (!v) return;
              try {
                if (shouldPlay) v.play().catch(function () {});
                else v.pause();
              } catch (e) {}
            });
          };
          document.getElementById("btnToggleCmpAudio").onclick = function (ev) {
            compareAudioSource = compareAudioSource === "v2" ? "v1" : (compareAudioSource === "v1" ? "mute" : "v2");
            applyCmpMute();
            ev.currentTarget.textContent = "🔊 Audio: " + (compareAudioSource === "v2" ? "V3 Showcase" : (compareAudioSource === "v1" ? "V1 Cockpit" : "Both Muted"));
          };
          selectionEl.querySelectorAll("[data-cmp-beat]").forEach(function (cb) {
            cb.onclick = function () {
              var bIdx = parseInt(cb.getAttribute("data-cmp-beat"), 10) || 0;
              var v2Times = [0.3, 4.6, 10.0, 14.8];
              var v1Times = [0.8, 3.0, 6.6, 10.4];
              if (v2) { try { v2.currentTime = Math.min(v2Times[bIdx], (v2.duration || 18) - 0.3); v2.play().catch(function () {}); } catch (e) {} }
              if (v1) { try { v1.currentTime = Math.min(v1Times[bIdx], (v1.duration || 13) - 0.3); v1.play().catch(function () {}); } catch (e) {} }
            };
          });
        } else if (activeStageTab === "rig") {
          mountOperatorLiveRig(st);
        } else if (activeStageTab === "critic") {
          var stripImg = document.getElementById("criticStripImg");
          if (stripImg) {
            stripImg.onerror = function () {
              var fb = stripImg.getAttribute("data-fallback");
              if (fb && stripImg.src.indexOf(fb.replace("./", "")) === -1) {
                stripImg.src = fb;
              }
            };
          }
          var bs3 = document.getElementById("btnStripV3");
          var bs2 = document.getElementById("btnStripV2");
          var bs1 = document.getElementById("btnStripV1");
          if (bs3) bs3.onclick = function () { stripEdition = "v2"; renderSelection(); };
          if (bs2) bs2.onclick = function () { stripEdition = "remake"; renderSelection(); };
          if (bs1) bs1.onclick = function () { stripEdition = "v1"; renderSelection(); };
        }
      }

      /* ── LIVE 60FPS V3 12-BRANCH GAME (WITH TACTILE CONTROLLER & 4×3 MATRIX) ── */
      function mountOperatorLiveRig(st) {
        stopLiveRig();
        var cv = document.getElementById("operatorLiveCanvas");
        var gm = window.__game;
        if (!cv || !gm) return;
        var id = st.id;

        gm.mount(cv, id, null, function (g) {
          var sInput = document.getElementById("opSnailInput");
          var sSaved = document.getElementById("opSnailSaved");
          if (sInput && document.activeElement !== sInput && typeof g.state.snailNote === "string") {
            if (sInput.value !== g.state.snailNote) sInput.value = g.state.snailNote;
          }
          if (sSaved) {
            sSaved.textContent = g.state.snailNote ? "✓ Saved" : "";
          }
        }, "v3", "root");

        var deckEl = document.getElementById("opV3DeckMount");
        if (deckEl && typeof gm.mountControllerDeck === "function") {
          gm.mountControllerDeck(deckEl, { showTreeMatrix: true });
        }

        var sInput = document.getElementById("opSnailInput");
        var sForm = document.getElementById("opSnailForm");
        var sSaved = document.getElementById("opSnailSaved");
        if (sInput) {
          sInput.oninput = function () {
            var saved = saveSnailNote(id, sInput.value);
            if (sSaved) sSaved.textContent = saved ? "✓ Saved" : "";
          };
        }
        if (sForm) {
          sForm.onsubmit = function (ev) {
            ev.preventDefault();
            gm.sendSnailMail(sInput ? sInput.value : undefined);
            if (sSaved) sSaved.textContent = "✓ Dispatched via △";
          };
        }
      }

      function syncMastheadHeight() {
        var mh = document.querySelector(".masthead");
        if (!mh) return;
        var h = Math.ceil(mh.getBoundingClientRect().height);
        if (h > 20) {
          document.documentElement.style.setProperty("--masthead-h", h + "px");
        }
      }
      syncMastheadHeight();
      window.addEventListener("resize", syncMastheadHeight);
      if (typeof ResizeObserver !== "undefined") {
        var mhEl = document.querySelector(".masthead");
        if (mhEl) new ResizeObserver(syncMastheadHeight).observe(mhEl);
      }

      function selectPorthole(id, updateHash) {
        var clamped = Math.max(1, Math.min(55, parseInt(id, 10) || 1));
        selectedId = clamped;
        remakeWatchFullSound = false;
        if (updateHash) {
          history.replaceState(null, "", "#p" + pad2(clamped));
        }
        var mhGameLink = document.getElementById("mastheadGameLink");
        if (mhGameLink) mhGameLink.href = "./trout-sub-game.html#p" + pad2(clamped);
        renderCatalogue();
        renderSelection();

        var curBtn = stationListEl.querySelector('[aria-current="true"]');
        if (curBtn && stationListEl) {
          var btnTop = curBtn.offsetTop - stationListEl.offsetTop;
          var btnBot = btnTop + curBtn.offsetHeight;
          var viewTop = stationListEl.scrollTop;
          var viewBot = viewTop + stationListEl.clientHeight;
          if (btnTop < viewTop + 8) {
            stationListEl.scrollTop = Math.max(0, btnTop - 12);
          } else if (btnBot > viewBot - 8) {
            stationListEl.scrollTop = Math.max(0, btnBot - stationListEl.clientHeight + 16);
          }
        }
      }

      // Global station step shortcuts ([ / ])
      window.addEventListener("keydown", function (ev) {
        var tag = ev.target && ev.target.tagName ? ev.target.tagName.toUpperCase() : "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

        if (ev.key === "[") {
          if (selectedId > 1) { ev.preventDefault(); selectPorthole(selectedId - 1, true); }
        } else if (ev.key === "]") {
          if (selectedId < 55) { ev.preventDefault(); selectPorthole(selectedId + 1, true); }
        }
      });

      // Filter pills & search input
      document.querySelectorAll("[data-fg]").forEach(function (pill) {
        pill.onclick = function () {
          activeFilter = pill.getAttribute("data-fg");
          document.querySelectorAll("[data-fg]").forEach(function (p) {
            p.setAttribute("aria-pressed", p === pill ? "true" : "false");
          });
          renderCatalogue();
          if (filteredIds.length && filteredIds.indexOf(selectedId) === -1) {
            selectPorthole(filteredIds[0], true);
          }
        };
      });

      qInput.oninput = function () {
        searchQuery = (qInput.value || "").trim().toLowerCase();
        renderCatalogue();
      };

      browseBtn.onclick = function () {
        var isCol = controlsWrap.getAttribute("data-collapsed") === "true";
        controlsWrap.setAttribute("data-collapsed", isCol ? "false" : "true");
        browseBtn.setAttribute("aria-expanded", isCol ? "true" : "false");
      };

      document.getElementById("brandHome").onclick = function (ev) {
        ev.preventDefault();
        selectPorthole(1, true);
      };

      window.addEventListener("hashchange", function () {
        var hId = parseHashId();
        if (hId && hId !== selectedId) selectPorthole(hId, false);
      });

      // Initial boot
      var startId = parseHashId() || 1;
      selectPorthole(startId, !location.hash);
    })();
  </script>
</body>
</html>
